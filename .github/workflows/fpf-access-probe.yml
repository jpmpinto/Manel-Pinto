name: FPF schedule parser validation

on:
  push:
    paths:
      - ".github/scripts/sync_fpf_schedule.py"
      - ".github/workflows/fpf-access-probe.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Read official FPF 2026/27 schedule without writing
        run: python3 .github/scripts/sync_fpf_schedule.py
