<style>

:root[data-theme="dark"]{--bg:#0e0f11;--card:#1a1c20;--tx:#f3f4f6;--mut:#9ca3af;--line:#2a2d33;--chip:#3b1219;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;background:var(--bg);color:var(--tx);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}body{padding-bottom:84px;min-height:100vh}header{background:var(--red);color:#fff;padding:14px 16px 12px;position:sticky;top:env(safe-area-inset-top,0px);z-index:5}body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--red);z-index:10}header h1{margin:0;font-size:19px}header p{margin:2px 0 0;font-size:13px;opacity:.9}main{padding:12px;max-width:640px;margin:0 auto}.round{font-size:12px;font-weight:700;color:var(--mut);text-transform:uppercase;letter-spacing:.04em;margin:14px 4px 6px}.game{display:flex;align-items:center;gap:10px;background:var(--card);border-radius:12px;padding:10px 12px;margin-bottom:6px;border-left:4px solid var(--line);cursor:pointer}.game.W{border-color:var(--win)}.game.D{border-color:var(--draw)}.game.L{border-color:var(--loss)}.when{width:44px;font-size:12px;color:var(--mut);text-align:center;line-height:1.3}.teams{flex:1;min-width:0}.row{display:flex;justify-content:space-between;font-size:15px;padding:1px 0}.row span:first-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.row b{margin-left:8px}.us{font-weight:700}.chips{margin-top:5px;display:flex;gap:5px;flex-wrap:wrap}.chip{background:var(--chip);color:var(--red);border-radius:999px;padding:2px 8px;font-size:12px;font-weight:700}.chip.n{background:var(--line);color:var(--mut)}.meta{font-size:11px;color:var(--mut);margin-top:4px}.badge{width:26px;height:26px;border-radius:7px;color:#fff;font-size:13px;font-weight:800;display:flex;align-items:center;justify-content:center;background:var(--mut)}.W .badge{background:var(--win)}.D .badge{background:var(--draw)}.L .badge{background:var(--loss)}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.stat{background:var(--card);border-radius:12px;padding:14px;text-align:center}.stat b{display:block;font-size:28px}.stat span{font-size:12px;color:var(--mut)}.stat.big{background:var(--red);color:#fff}.stat.big span{color:#fff;opacity:.85}h2{font-size:14px;margin:18px 4px 8px;color:var(--mut);text-transform:uppercase;letter-spacing:.04em}.empty{text-align:center;color:var(--mut);padding:40px 20px;font-size:15px}nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);z-index:6}nav button{flex:1;border:0;background:none;color:var(--mut);padding:10px 0 9px;font-size:12px;font-weight:600}nav button.on{color:var(--red)}nav i{display:block;font-style:normal;font-size:20px}.fab{position:fixed;right:16px;bottom:calc(72px + env(safe-area-inset-bottom,0px));width:56px;height:56px;border-radius:50%;border:0;background:var(--red);color:#fff;font-size:30px;box-shadow:0 4px 14px rgba(0,0,0,.35);z-index:7}.sheet{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:20;display:none;align-items:flex-end}.sheet.open{display:flex}.panel{background:var(--card);width:100%;max-height:92%;overflow:auto;border-radius:18px 18px 0 0;padding:16px 16px calc(20px + env(safe-area-inset-bottom,0px))}.panel h3{margin:0 0 12px}label{display:block;font-size:12px;color:var(--mut);margin:10px 0 4px;font-weight:600}input,select,textarea{width:100%;font-size:16px;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--tx);font-family:inherit}.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}.step{display:flex;align-items:center;gap:8px}.step input{text-align:center}.step button{width:44px;height:44px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--tx);font-size:22px}.btns{display:flex;gap:8px;margin-top:16px}.btn{flex:1;padding:13px;border-radius:10px;border:0;font-size:16px;font-weight:700;background:var(--line);color:var(--tx)}.btn.p{background:var(--red);color:#fff}.btn.d{background:none;color:var(--loss);flex:0 0 auto;padding:13px 10px}.note{font-size:13px;color:var(--mut);line-height:1.5;margin:6px 4px}.card{background:var(--card);border-radius:12px;padding:12px;margin-bottom:8px}.card .btn{margin-top:8px;width:100%}

<body>
<header><h1>Manuel Pinto</h1><p>Dragon Force C · Grupo Vermelho · 26/27</p></header>
<main id="main"></main><button class="fab" id="fab" aria-label="Novo jogo">+</button>
<nav><button data-t="games" class="on"><i>⚽</i>Jogos</button><button data-t="stats"><i>📊</i>Estatísticas</button><button data-t="more"><i>⚙️</i>Mais</button></nav>
<div class="sheet" id="sheet"><div class="panel" id="panel"></div></div><input type="file" id="file" accept="application/json" hidden>
<script>
var KEY="diario-manel-2627",tab="games",S={games:[]};
var SEED=[
["2026-10-24","Jornada 1","C.R.P. Barrosas “B”",0,"Complexo do C.R.P. Barrosas (Felgueiras)","12:30"],
["2026-10-31","Jornada 2","S.C. Castêlo Maia “B”",1,"A Indicar","11:30"],
["2026-11-07","Jornada 3","A. Vermelhinhos V.N.G. “B”",0,"Complexo Desportivo Sermonde","11:30"],
["2026-11-14","Jornada 4","G.D.C. Ferreira",1,"New Balance Park - Sint","11:30"],
["2026-11-21","Jornada 5","Varzim S.C. “C”",0,"Campo Sint Nº1 Est Mun Póvoa de Varzim","11:30"],
["2026-11-28","Jornada 6","",0,"","11:30"],
["2026-12-05","Jornada 7","Aliança F.C. Gandra",1,"New Balance Park - Sint","11:30"],
["2026-12-12","Jornada 8","Custóias F.C. “B”",0,"Complexo Desportivo Custóias","11:30"],
["2026-12-19","Jornada 9","C.D. Leões Seroa",1,"New Balance Park - Sint","11:30"],
["2027-01-09","Jornada 10","A.D.L. - A.D. Lousada “B”",0,"Complexo Desportivo Lousada - Fut5 Nº1","11:30"],
["2027-01-16","Jornada 11","Aliados F.C. Lordelo",1,"New Balance Park - Sint","11:30"]];
function seed(){if(!Array.isArray(S.hidden))S.hidden=[];var officialIds=SEED.map(function(s){return "fpf-r"+s[1].replace(/\D/g,"")});S.hidden=S.hidden.filter(function(id){return officialIds.indexOf(id)<0});SEED.forEach(function(s){var id="fpf-r"+s[1].replace(/\D/g,"");var ex=S.games.find(function(g){return g.id===id});if(ex){if(s[6]&&ex.pending===false&&ex.opp&&ex.opp!=="A confirmar"){ex.date=s[0];ex.round=s[1];ex.time=s[5];return}ex.date=s[0];ex.round=s[1];ex.opp=s[2];ex.home=!!s[3];ex.venue=s[4];ex.time=s[5];ex.pending=!!s[6];ex.bye=!s[2]&&!s[6];return}S.games.push({id:id,date:s[0],time:s[5],round:s[1],opp:s[2],home:!!s[3],us:null,them:null,played:true,goals:0,assists:0,notes:"",venue:s[4],pending:!!s[6],bye:!s[2]&&!s[6]})});save()}
function load(){try{var r=localStorage.getItem(KEY);if(r)S=JSON.parse(r)}catch(e){}if(!S.games)S.games=[];seed()}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function $(s){return document.querySelector(s)}function esc(t){return String(t==null?"":t).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function res(g){if(g.us==null||g.them==null)return"";return g.us>g.them?"W":g.us<g.them?"L":"D"}function fmt(d){if(!d)return"";var p=d.split("-");return p[2]+"/"+p[1]}function sorted(){return S.games.slice().sort(function(a,b){return(a.date||"9")<(b.date||"9")?-1:1})}
function renderGames(){var gs=sorted();if(!gs.length)return'<div class="empty">Ainda não há jogos.<br>Toca no + para registar o primeiro.</div>';var groups={},order=[];gs.forEach(function(g){var k=g.round||"Sem jornada";if(!groups[k]){groups[k]=[];order.push(k)}groups[k].push(g)});return order.map(function(k){return'<div class="round">'+esc(k)+'</div>'+groups[k].map(function(g){if(g.pending)return'<div class="game" data-id="'+g.id+'"><div class="when">'+fmt(g.date)+(g.time?'<br>'+g.time:'')+'</div><div class="teams"><div class="row"><span>Adversário por confirmar</span></div><div class="meta">Jornada 6 · informação a confirmar na FPF</div></div><div class="badge">?</div></div>';if(g.bye)return'<div class="game" style="cursor:default;opacity:.7"><div class="when">'+fmt(g.date)+'</div><div class="teams"><div class="row"><span>Folga do Dragon Force C nesta jornada</span></div><div class="meta">Calendário do Grupo Vermelho</div></div></div>';var r=res(g),us="Dragon Force C",top=g.home?us:g.opp,bot=g.home?g.opp:us;var st=r!==""?{t:g.home?g.us:g.them,b:g.home?g.them:g.us}:{t:"-",b:"-"};var chips="";if(g.played===false)chips='<span class="chip n">Não jogou</span>';else{if(g.goals>0)chips+='<span class="chip">⚽ '+g.goals+'</span>';if(g.assists>0)chips+='<span class="chip">🅰️ '+g.assists+'</span>'}return'<div class="game '+r+'" data-id="'+g.id+'"><div class="when">'+fmt(g.date)+(g.time?'<br>'+g.time:'')+'</div><div class="teams"><div class="row '+(g.home?"us":"")+'"><span>'+esc(top)+'</span><b>'+(st.t==null?"-":st.t)+'</b></div><div class="row '+(g.home?"":"us")+'"><span>'+esc(bot)+'</span><b>'+(st.b==null?"-":st.b)+'</b></div>'+(chips?'<div class="chips">'+chips+'</div>':'')+(g.venue?'<div class="meta">'+esc(g.venue)+'</div>':'')+'</div><div class="badge">'+(r==="W"?"V":r==="D"?"E":r==="L"?"D":"–")+'</div></div>'}).join("")}).join("")}
function renderStats(){var all=S.games,done=all.filter(function(g){return res(g)!==""});if(!all.length)return'<div class="empty">As estatísticas aparecem quando registares jogos.</div>';var v=0,e=0,d=0,gm=0,gs=0,pj=0,G=0,A=0;done.forEach(function(g){var r=res(g);if(r==="W")v++;else if(r==="D")e++;else d++;gm+=g.us;gs+=g.them});all.forEach(function(g){if(g.played!==false&&res(g)!==""){pj++;G+=+g.goals||0;A+=+g.assists||0}});var avg=pj?((G+A)/pj).toFixed(2):"0";return'<h2>Manel</h2><div class="grid"><div class="stat big"><b>'+G+'</b><span>Golos</span></div><div class="stat big"><b>'+A+'</b><span>Assistências</span></div><div class="stat"><b>'+pj+'</b><span>Jogos disputados</span></div><div class="stat"><b>'+avg+'</b><span>Golos + assist. por jogo</span></div></div><h2>Equipa</h2><div class="grid"><div class="stat"><b>'+done.length+'</b><span>Jogos</span></div><div class="stat"><b>'+v+'V '+e+'E '+d+'D</b><span>Registo</span></div><div class="stat"><b>'+gm+'</b><span>Golos marcados</span></div><div class="stat"><b>'+gs+'</b><span>Golos sofridos</span></div></div>'}
function renderMore(){return'<h2>Cópia de segurança</h2><div class="card"><div class="note" style="margin:0">Os dados ficam guardados neste aparelho e navegador. Exporta de vez em quando para não perderes nada ou passar os dados para outro telemóvel.</div><button class="btn p" id="exp">Exportar dados</button><button class="btn" id="imp">Importar dados</button></div><h2>Instalar no iPhone</h2><div class="card"><div class="note" style="margin:0">No Safari, toca em Partilhar e depois em “Adicionar ao ecrã principal”. Guarda uma cópia de segurança regularmente. Os dados guardados no Safari e na app instalada podem ser diferentes.</div></div><h2>Perigo</h2><div class="card"><button class="btn d" id="wipe" style="width:100%">Apagar todos os jogos</button></div>'}
function render(){var m=$("#main");m.innerHTML=tab==="games"?renderGames():tab==="stats"?renderStats():renderMore();$("#fab").style.display=tab==="games"?"block":"none";document.querySelectorAll("nav button").forEach(function(b){b.classList.toggle("on",b.dataset.t===tab)});if(tab==="more"){$("#exp").onclick=exportData;$("#imp").onclick=function(){$("#file").click()};$("#wipe").onclick=function(){if(confirm("Apagar todos os jogos? Isto não pode ser desfeito.")){S.games=[];save();render()}}}}
function step(id,val){return'<div class="step"><button type="button" data-s="'+id+'" data-d="-1">−</button><input id="'+id+'" type="number" inputmode="numeric" min="0" value="'+(val==null?"":val)+'"><button type="button" data-s="'+id+'" data-d="1">+</button></div>'}
function openSheet(id){var g=S.games.find(function(x){return x.id===id})||{home:true,played:true,goals:0,assists:0,date:new Date().toISOString().slice(0,10)};var opps=[],seen={};S.games.forEach(function(x){if(x.opp&&!seen[x.opp]){seen[x.opp]=1;opps.push(x.opp)}});var played=g.played!==false;$("#panel").innerHTML='<h3>'+(id?"Editar jogo":"Novo jogo")+'</h3><div class="two"><div><label>Data</label><input id="f_date" type="date" value="'+(g.date||"")+'"></div><div><label>Jornada / fase</label><input id="f_round" placeholder="Jornada 1" value="'+esc(g.round||"")+'"></div></div><label>Adversário</label><input id="f_opp" list="opps" placeholder="Nome da equipa" value="'+esc(g.opp||"")+'"><datalist id="opps">'+opps.map(function(o){return'<option value="'+esc(o)+'">'}).join("")+'</datalist><label>Local</label><select id="f_home"><option value="1"'+(g.home?" selected":"")+'>Em casa</option><option value="0"'+(g.home?"":" selected")+'>Fora</option></select><label>Campo</label><input id="f_venue" value="'+esc(g.venue||"")+'"><div class="two"><div><label>Golos Dragon Force C</label>'+step("f_us",g.us)+'</div><div><label>Golos adversário</label>'+step("f_them",g.them)+'</div></div><div class="note">Deixa o resultado em branco se o jogo ainda não se realizou.</div><label>O Manel jogou?</label><select id="f_played"><option value="1"'+(played?" selected":"")+'>Sim</option><option value="0"'+(played?"":" selected")+'>Não</option></select><div class="two"><div><label>⚽ Golos do Manel</label>'+step("f_goals",g.goals||0)+'</div><div><label>🅰️ Assistências</label>'+step("f_assists",g.assists||0)+'</div></div><label>Notas do jogo</label><textarea id="f_notes" rows="3" placeholder="Como correu, momentos a recordar…">'+esc(g.notes||"")+'</textarea><div class="btns">'+(id?'<button class="btn d" id="del">Apagar</button>':"")+'<button class="btn" id="cancel">Cancelar</button><button class="btn p" id="ok">Guardar</button></div>';$("#sheet").classList.add("open");$("#cancel").onclick=closeSheet;if(id)$("#del").onclick=function(){if(String(id).indexOf("fpf-")===0){alert("Este jogo faz parte do calendário oficial do Grupo Vermelho e fica sempre disponível. Podes editar o resultado, os golos, as assistências e as notas.");return}if(confirm("Apagar este jogo?")){S.games=S.games.filter(function(x){return x.id!==id});save();closeSheet();render()}};$("#ok").onclick=function(){var n=function(i){var v=$(i).value;return v===""?null:Math.max(0,parseInt(v,10)||0)};var o={id:id||("g"+Date.now()),date:$("#f_date").value,round:$("#f_round").value.trim(),opp:$("#f_opp").value.trim(),venue:$("#f_venue").value.trim(),time:g.time||"",home:$("#f_home").value==="1",us:n("#f_us"),them:n("#f_them"),played:$("#f_played").value==="1",goals:n("#f_goals")||0,assists:n("#f_assists")||0,notes:$("#f_notes").value.trim(),pending:!!g.pending&&$("#f_opp").value.trim().toLowerCase()==="a confirmar",bye:!!g.bye};if(!o.opp){alert("Indica o adversário.");return}if((o.us==null)!==(o.them==null)){alert("Preenche os dois golos ou nenhum.");return}if(!o.played){o.goals=0;o.assists=0}var i=S.games.findIndex(function(x){return x.id===o.id});if(i>=0)S.games[i]=o;else S.games.push(o);save();closeSheet();render()}}
function closeSheet(){$("#sheet").classList.remove("open")}
function exportData(){var b=new Blob([JSON.stringify(S,null,2)],{type:"application/json"});var f=new File([b],"diario-manel-2627.json",{type:"application/json"});if(navigator.canShare&&navigator.canShare({files:[f]})){navigator.share({files:[f]}).catch(function(){});return}var a=document.createElement("a");a.href=URL.createObjectURL(b);a.download=f.name;document.body.appendChild(a);a.click();a.remove()}
$("#file").onchange=function(ev){var f=ev.target.files[0];if(!f)return;var r=new FileReader();r.onload=function(){try{var d=JSON.parse(r.result);if(!d.games)throw 0;if(confirm("Substituir os dados atuais por "+d.games.length+" jogos do ficheiro?")){S=d;save();render()}}catch(e){alert("Ficheiro inválido.")}};r.readAsText(f);ev.target.value=""};
document.addEventListener("click",function(e){var s=e.target.closest("[data-s]");if(s){var i=document.getElementById(s.dataset.s),v=parseInt(i.value,10);if(isNaN(v))v=(s.dataset.s==="f_us"||s.dataset.s==="f_them")?(s.dataset.d>0?-1:0):0;i.value=Math.max(0,v+parseInt(s.dataset.d,10));return}var g=e.target.closest(".game");if(g){if(g.dataset.id)openSheet(g.dataset.id);return}var t=e.target.closest("nav button");if(t){tab=t.dataset.t;render();window.scrollTo(0,0)}});
$("#fab").onclick=function(){openSheet()};$("#sheet").onclick=function(e){if(e.target.id==="sheet")closeSheet()};
try{var c=document.createElement("canvas");c.width=c.height=180;var x=c.getContext("2d");x.fillStyle="#c8102e";x.fillRect(0,0,180,180);x.fillStyle="#fff";x.font="bold 100px -apple-system,sans-serif";x.textAlign="center";x.textBaseline="middle";x.fillText("M",90,96);var l=document.createElement("link");l.rel="apple-touch-icon";l.href=c.toDataURL("image/png");document.head.appendChild(l)}catch(e){}
load();render();
</script>
</body></html>
