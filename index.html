 m.innerHTML='<section class="auth-wrap"><div class="auth-card"><h2>Diário do Manel</h2><p>Inicia sessão para guardar jogos, resultados, golos, assistências e relatos na nuvem e sincronizá-los entre dispositivos.</p><label for="auth-email">Email</label><input id="auth-email" type="email" autocomplete="email" inputmode="email" placeholder="O teu email" required><label for="auth-password">Palavra-passe</label><input id="auth-password" type="password" autocomplete="current-password" minlength="8" placeholder="Pelo menos 8 caracteres" required><button type="button" class="btn p" id="auth-login">Entrar</button><button type="button" class="btn" id="auth-register">Criar conta</button><div id="auth-message" class="auth-status" role="status">'+esc(message||"A tua conta é privada. Se já tens conta, entra; caso contrário, cria uma conta com o teu email.")+'</div><div class="note">Na primeira entrada, os registos guardados neste navegador serão transferidos para a tua conta, se ainda não existirem na nuvem.</div><div class="guest-entry"><h3>Acesso de visitante</h3><p>Consulta o calendário, resultados e notas sem criar conta nem introduzir email. Este acesso é apenas de leitura.</p><label for="guest-code">Código de visitante</label><input id="guest-code" type="text" autocomplete="one-time-code" autocapitalize="characters" placeholder="XXXX-XXXX-XXXX"><button type="button" class="btn" id="guest-login">Entrar sem email</button><div id="guest-message" class="auth-status" role="status"></div></div></div></section>';
 $("#fab").style.display="none";document.querySelector("nav").style.display="none";
 var visitorOnly=new URLSearchParams(window.location.search).get("visitor")==="1";
 if(visitorOnly){
  ["label[for='auth-email']","#auth-email","label[for='auth-password']","#auth-password","#auth-login","#auth-register","#auth-message",".auth-card > .note"].forEach(function(sel){var el=$(sel);if(el)el.style.display="none"});
  var intro=$(".auth-card > p");if(intro)intro.textContent="Consulta o Diário do Manel em modo visitante. Não precisas de email nem de criar conta.";
  var guestTitle=$(".guest-entry h3");if(guestTitle)guestTitle.textContent="Entrar como visitante";
  var guestIntro=$(".guest-entry p");if(guestIntro)guestIntro.textContent="Introduz o código de visitante que recebeste para consultar jogos, resultados e notas. Este acesso não permite alterar os dados.";
  var guestCode=$("#guest-code");if(guestCode)guestCode.setAttribute("placeholder","XXXX-XXXX-XXXX");
  var authCard=$(".auth-card");if(authCard)authCard.classList.add("visitor-only");
 }
 function status(t){var e=$("#auth-message");if(e)e.textContent=t}
 var guestBtn=$("#guest-login");
 if(guestBtn)guestBtn.onclick=async function(){
  var code=$("#guest-code").value.trim().toUpperCase(),msg=$("#guest-message");
  function guestMessage(t){if(msg)msg.textContent=t}
  if(!code){guestMessage("Introduz o código de visitante.");return}
  guestMessage("A validar o código e a carregar o diário…");
  guestBtn.disabled=true;
  try{
   var response=await fetch(SUPABASE_URL+"/functions/v1/diario-visitante",{method:"POST",headers:{"Content-Type":"application/json","apikey":SUPABASE_PUBLISHABLE_KEY},body:JSON.stringify({code:code})});
   var payload=await response.json().catch(function(){return{}});
   if(!response.ok)throw new Error(payload.error||"Não foi possível validar o código.");
   if(!Array.isArray(payload.matches))throw new Error("A resposta do serviço não contém os jogos.");
   diaryAuthGeneration++;diaryGuestMode=true;diaryUser={id:"guest",email:null};diarySeasonId=null;diaryCloudReady=false;diaryLocalKey=KEY+":visitor";diaryLoadedUser="guest";diaryCloudRowIds={};
   try{localStorage.setItem(DIARY_GUEST_CODE_KEY,code.replace(/[^A-Z0-9]/g,""))}catch(storageError){}
   S={games:payload.matches.map(diaryRowToGame),hidden:[]};tab="games";render();diaryStatus("Modo visitante · só de leitura",false);
  }catch(e){guestMessage(e&&e.message?e.message:"Não foi possível abrir o diário. Tenta novamente.");guestBtn.disabled=false}
 };
 if(visitorOnly&&guestBtn){try{var savedVisitorCode=localStorage.getItem(DIARY_GUEST_CODE_KEY);if(savedVisitorCode){$("#guest-code").value=savedVisitorCode;guestBtn.click()}}catch(storageError){}}
 if(!diarySupabase){status("Não foi possível carregar o serviço de autenticação. Verifica a ligação à Internet.");return}
 $("#auth-login").onclick=async function(){var email=$("#auth-email").value.trim(),password=$("#auth-password").value;if(!email||!password){status("Preenche o email e a palavra-passe.");return}status("A iniciar sessão…");var x=await diarySupabase.auth.signInWithPassword({email:email,password:password});if(x.error)status("Não foi possível entrar: "+x.error.message);else status("Sessão iniciada. A carregar os teus dados…")};
 $("#auth-register").onclick=async function(){var email=$("#auth-email").value.trim(),password=$("#auth-password").value;if(!email||!password){status("Preenche o email e a palavra-passe.");return}if(password.length<8){status("Usa uma palavra-passe com pelo menos 8 caracteres.");return}status("A criar conta…");var x=await diarySupabase.auth.signUp({email:email,password:password,options:{emailRedirectTo:"https://manuelpinto2022.vercel.app/"}});if(x.error)status("Não foi possível criar a conta: "+x.error.message+" Se o erro mencionar o endereço de redirecionamento, é necessário autorizar o domínio da Vercel nas definições de autenticação do Supabase.");else if(x.data&&x.data.session)status("Conta criada. A carregar os dados…");else status("Conta criada. Confirma o email que recebeste e depois volta a este site para iniciar sessão. Verifica também a pasta de spam.")};
}
render=function(){
 var m=$("#main");
 if(!diaryUser){diaryRenderAuth();return}
 if(diaryGuestMode&&tab==="more")tab="games";
 document.querySelector("nav").style.display="flex";
 m.innerHTML=tab==="games"?renderOverview()+renderGames():tab==="stats"?renderStats():renderMore();
 if(diaryGuestMode){
  m.innerHTML='<div class="card"><div class="note">Modo visitante: podes consultar jogos e registos, mas não alterar dados.</div><button type="button" class="btn" id="guest-exit">Sair do acesso de visitante</button></div>'+m.innerHTML;
  $("#guest-exit").onclick=function(){try{localStorage.removeItem(DIARY_GUEST_CODE_KEY)}catch(storageError){}diaryGuestMode=false;diaryUser=null;diarySeasonId=null;diaryCloudReady=false;diaryLocalKey=KEY;diaryCloudRowIds={};S={games:[],hidden:[]};tab="games";render()};
 }
 $("#fab").style.display=tab==="games"&&!diaryGuestMode?"block":"none";
 document.querySelectorAll("nav button").forEach(function(b){b.style.display=diaryGuestMode&&b.dataset.t==="more"?"none":"";b.classList.toggle("on",b.dataset.t===tab)});
 if(tab==="more"){
  $("#exp").onclick=exportData;$("#imp").onclick=function(){$("#file").click()};
  if($("#logout"))$("#logout").onclick=async function(){diaryStatus("A terminar sessão…",false);var x=await diarySupabase.auth.signOut();if(x.error)diaryStatus("Não foi possível terminar sessão: "+x.error.message,true)};
  $("#wipe").onclick=async function(){if(!confirm("Apagar resultados, golos, assistências, relatos e jogos personalizados? O calendário oficial será reposto. Esta ação não pode ser desfeita."))return;if(!diaryCloudReady){alert("A sincronização com a nuvem não está ativa. Não apaguei nada.");return}var d=await diarySupabase.from("matches").delete().eq("season_id",diarySeasonId);if(d.error){alert("Não foi possível repor os registos: "+d.error.message);return}diaryCloudRowIds={};diaryCloudReady=false;S={games:[],hidden:[]};seed();diaryCloudReady=true;await diarySyncCloud();render()};
 }
};
renderMore=function(){return(diaryUser?'<h2>Conta e sincronização</h2><div class="card"><div class="note" style="margin:0">Sessão iniciada como <b>'+esc(diaryUser.email||"conta privada")+'</b>. Os dados ficam numa base de dados privada e sincronizam entre dispositivos.</div><button class="btn" id="logout">Terminar sessão</button></div>':'')+'<h2>Cópia de segurança</h2><div class="card"><div class="note" style="margin:0">Os dados são sincronizados com a nuvem. Podes também exportar um ficheiro JSON para arquivo ou importá-lo mais tarde.</div><button class="btn p" id="exp">Exportar dados</button><button class="btn" id="imp">Importar dados</button></div><h2>Instalar no iPhone</h2><div class="card"><div class="note" style="margin:0">No Safari, toca em Partilhar e depois em “Adicionar ao ecrã principal”. Inicia sessão com a mesma conta para ver os mesmos jogos.</div></div><h2>Repor registos</h2><div class="card"><button class="btn d" id="wipe" style="width:100%">Repor calendário e apagar resultados e notas</button></div>'};
$("#file").onchange=function(ev){var f=ev.target.files[0];if(!f)return;var r=new FileReader();r.onload=async function(){try{var d=JSON.parse(r.result);if(!d.games)throw new Error("Ficheiro inválido");if(confirm("Substituir os dados atuais por "+d.games.length+" jogos do ficheiro? Os jogos remotos desta época também serão substituídos.")){if(diaryCloudReady&&diarySeasonId){var del=await diarySupabase.from("matches").delete().eq("season_id",diarySeasonId);if(del.error)throw del.error}diaryCloudRowIds={};diaryCloudReady=false;S=d;if(!Array.isArray(S.games))throw new Error("Ficheiro inválido");seed();diaryStoreLocal();diaryCloudReady=!!diaryUser&&!!diarySeasonId;render();diaryQueueSync()}}catch(e){alert("Não foi possível importar o ficheiro: "+(e&&e.message?e.message:"formato inválido"))}};r.readAsText(f);ev.target.value=""};
if(diarySupabase){diarySupabase.auth.onAuthStateChange(function(event,session){setTimeout(function(){diaryHandleSession(session).catch(function(e){console.error("Diário do Manel: erro de autenticação",e);diaryStatus("Erro de sessão: "+(e&&e.message?e.message:"erro"),true)})},0)})}
fetch("./assets/manel-profile-photo.b64?v=20261021-2",{cache:"no-store"}).then(function(r){if(!r.ok)throw new Error("HTTP "+r.status);return r.text()}).then(function(b64){b64=b64.trim();if(!b64||b64.length%4!==0||!/^[A-Za-z0-9+/]+={0,2}$/.test(b64))throw new Error("Ficheiro de fotografia inválido");var photo=document.getElementById("manel-profile");if(photo){photo.src="data:image/jpeg;base64,"+b64;photo.onerror=function(){photo.style.display="none";console.error("A fotografia foi descarregada, mas o navegador não conseguiu descodificá-la")}}}).catch(function(e){console.warn("Não foi possível carregar a fotografia do Manel",e)});
diaryRenderAuth();

</script>
